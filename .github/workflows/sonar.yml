# Same-repo SonarQube Cloud scan.  The job body lives in fleet-sonar.yml
# (reusable across the package family; hosted here).  The local ``./`` ref
# runs it at this very commit, so the reusable workflow is exercised by
# its own repo's CI — sibling repos pin it by release tag instead.
# Fork PRs are handled by sonar_pr.yml via workflow_run in the trusted
# base-repo context, because GitHub does not expose SONAR_TOKEN to runs
# originating from forks.
name: SonarQube Cloud

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  sonar:
    uses: ./.github/workflows/fleet-sonar.yml
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
