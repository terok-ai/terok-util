# Fork-PR SonarQube Cloud scan.  A workflow_run trigger cannot live in a
# reusable workflow, so this thin file carries only the trigger; the job
# body — including every pwn-request mitigation and the reviewed
# ``allow-unsafe-pr-checkout`` opt-in — lives in fleet-sonar-pr.yml
# (reusable across the package family; hosted here).  The local ``./`` ref
# runs it at this very commit, so the reusable workflow is exercised by
# its own repo's CI — sibling repos pin it by release tag instead.
name: Sonar PR

on:
  workflow_run:
    workflows: ["Tests & Analysis"]
    types: [completed]

permissions:
  actions: read
  contents: read

jobs:
  sonar:
    uses: ./.github/workflows/fleet-sonar-pr.yml
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
