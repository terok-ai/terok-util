[build-system]
requires = ["hatchling>=1.27", "hatch-vcs>=0.5"]
build-backend = "hatchling.build"

[project]
name = "terok-util"
description = "Shared utility library for the terok-* sibling packages"
readme = "README.md"
license = "Apache-2.0"
authors = [
    {name = "Jiri Vyskocil", email = "jiri@vyskocil.com"},
]
maintainers = [
    {name = "Jiri Vyskocil", email = "jiri@vyskocil.com"},
]
keywords = ["terok", "shared", "utilities"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]
requires-python = ">=3.12,<4.0"
dynamic = ["version"]
# Dependency pins follow the policy in AGENTS.md ("Dependency Pinning &
# pyproject.toml Hygiene").  Keep the dependency list comment-free.
dependencies = [
    "platformdirs~=4.10",
    "ruamel.yaml==0.19.1",
    "jinja2~=3.1",
]

[project.scripts]
terok-matrix = "terok_util.matrix.cli:main"

[project.urls]
Homepage = "https://terok-ai.github.io/terok-util/"
Repository = "https://github.com/terok-ai/terok-util"
Documentation = "https://terok-ai.github.io/terok-util/"
Issues = "https://github.com/terok-ai/terok-util/issues"
Changelog = "https://github.com/terok-ai/terok-util/blob/master/CHANGELOG.md"
Security = "https://github.com/terok-ai/terok-util/security/policy"

[dependency-groups]
dev = [
    "ruff>=0.15.20",
    "bandit>=1.7",
    "docstr-coverage>=2.3.2,<3",
    "complexipy>=6.0.1",
    "vulture>=2.12",
    "reuse>=6.2.0,<7",
    "tach>=0.35.0,<0.36",
    "pre-commit>=4.0",
    "mypy>=2.1.0,<3.0",
]
test = [
    "pytest>=9.1.1",
    "pytest-cov>=4.0",
]
docs = [
    "properdocs>=1.6.7",
    "mkdocs-material>=9.7.6",
    "mkdocstrings[python]>=0.26",
    "mkdocs-literate-nav>=0.6",
    "mkdocs-section-index>=0.3",
    "mkdocs-terok @ https://github.com/terok-ai/mkdocs-terok/releases/download/v0.8.0a1/mkdocs_terok-0.8.0a1-py3-none-any.whl",
]

[tool.uv]
default-groups = ["dev", "test"]

[tool.hatch.version]
source = "vcs"
fallback-version = "0.3.0a5"

[tool.hatch.build.targets.wheel]
packages = ["src/terok_util"]

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
python_files = ["test_*.py"]
python_classes = ["Test*", "*Tests"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E",      # pycodestyle errors
  "W",      # pycodestyle warnings
  "F",      # pyflakes
  "I",      # isort
  "B",      # flake8-bugbear
  "C4",     # flake8-comprehensions
  "UP",     # pyupgrade
  "SIM",    # flake8-simplify
]
ignore = [
  "E501",   # line too long (handled by formatter)
  "B904",   # raise from in except
  "SIM102", # nested if statements
  "SIM105", # contextlib.suppress vs try/except/pass
  "SIM108", # use ternary operator
  "SIM117", # nested with statements
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E402"]

[tool.ruff.lint.isort]
known-first-party = ["terok_util"]
combine-as-imports = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

# Static type checking -- see `make typecheck`.
[tool.mypy]
python_version = "3.12"
files = ["src/terok_util"]
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true
no_implicit_optional = true
strict_equality = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
disable_error_code = ["import-untyped"]
pretty = true
show_error_codes = true

[tool.bandit]
exclude_dirs = ["tests", "build", "dist", ".venv", "docs"]
# Project-wide skips:
#   B404 -- "consider possible security implications of subprocess module".
#          We use subprocess deliberately for fixed-argv shellouts; per-call
#          ``# nosec B603`` covers the argv-injection concern at each site.
skips = ["B404"]
