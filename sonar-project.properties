# CI and `make sonar-inputs` write scanner inputs under reports/ so the repo root
# stays clean for humans. Unit tests write coverage/junit there, and the Ruff/Bandit
# report targets emit the JSON files imported below.
sonar.organization=terok-ai
sonar.projectKey=terok-ai_terok-util
sonar.sources=src
sonar.tests=tests
sonar.python.coverage.reportPaths=reports/coverage.xml
# The pytest11 entry-point plugin loads at pytest bootstrap, before coverage
# starts, so it never shows as covered however well its hooks are tested
# (directly, in tests/unit/test_matrix_skip_plugin.py).  Exclude it from the
# coverage metric to match the coverage.run omit in pyproject.toml.
sonar.coverage.exclusions=src/terok_util/matrix_skip_plugin.py
sonar.python.bandit.reportPaths=reports/bandit-report.json
sonar.python.ruff.reportPaths=reports/ruff-report.json
