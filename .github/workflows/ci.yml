# The static-check battery lives in fleet-checks.yml (reusable across
# the package family; hosted here).  The local ``./`` ref runs it at
# this very commit, so the reusable workflow is exercised by its own
# repo's CI — sibling repos pin it by release tag instead.
name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

# Cancel stale CI runs when a newer commit lands on the same PR; on
# master the queue runs in order so master pushes are never cancelled.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  checks:
    uses: ./.github/workflows/fleet-checks.yml
