# Pin third-party actions to full commit SHAs for supply-chain security.
# GitHub-owned actions (actions/*) may use version tags.
#
# Reusable same-repo SonarQube Cloud scan for the terok package family.
# Kept split from analysis.yml so its third-party wait time doesn't block
# the Tests & Analysis workflow's conclusion (which docs.yml waits on, and
# which gates the master Pages deploy).
#
# Nothing here varies per repo — the project key and report paths come
# from the caller's checked-out sonar-project.properties — so the whole
# interface is one secret.  A consumer repo's sonar.yml is a thin caller:
#
#   on:
#     push: { branches: [master] }
#     pull_request: { branches: [master] }
#     workflow_dispatch:
#   jobs:
#     sonar:
#       uses: terok-ai/terok-util/.github/workflows/fleet-sonar.yml@vX.Y.Z
#       secrets:
#         SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
#
# terok-util itself calls it via the local `./` form, so this file is
# exercised by the hosting repo's own CI at every commit.
#
# Handled contexts (the job guard reproduces the per-repo originals; the
# github context inside a called workflow is the caller's, so the caller's
# event drives the guard):
#   - push to master
#   - same-repo pull request against master (excluding dependabot)
#   - workflow_dispatch on master
# Fork PRs are handled by fleet-sonar-pr.yml via workflow_run in the
# trusted base-repo context, because GitHub does not expose SONAR_TOKEN to
# runs originating from forks.

name: Fleet sonar (reusable)

on:
  workflow_call:
    secrets:
      SONAR_TOKEN:
        description: "SonarQube Cloud token for the caller's Sonar project"
        required: true

permissions:
  actions: read
  contents: read

jobs:
  sonar:
    name: SonarQube Cloud
    if: >-
      github.repository_owner == 'terok-ai' &&
      (github.event_name == 'push'
       || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master')
       || (github.actor != 'dependabot[bot]'
           && github.event.pull_request.head.repo.full_name == github.repository))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Wait for Tests & Analysis on this commit
        uses: actions/github-script@v9
        with:
          script: |
            const deadline = Date.now() + 20 * 60 * 1000;
            const sleep = ms => new Promise(r => setTimeout(r, ms));
            const sha = context.payload.pull_request?.head.sha || context.sha;
            while (Date.now() < deadline) {
              const { data } = await github.rest.actions.listWorkflowRuns({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: 'analysis.yml',
                head_sha: sha,
                per_page: 5,
              });
              const run = data.workflow_runs[0];
              if (run?.status === 'completed') {
                if (run.conclusion === 'success') {
                  core.info(`Tests & Analysis succeeded for ${sha}`);
                  return;
                }
                core.setFailed(`Tests & Analysis ${run.conclusion} for ${sha}`);
                return;
              }
              core.info(`Tests & Analysis for ${sha}: ${run?.status ?? 'not yet started'} — waiting`);
              await sleep(20_000);
            }
            core.setFailed('Timed out after 20m waiting for Tests & Analysis')

      - name: Coverage artifact
        uses: dawidd6/action-download-artifact@b6e2e70617bc3265edd6dab6c906732b2f1ae151 # v21
        with:
          workflow: analysis.yml
          workflow_conclusion: success
          commit: ${{ github.event.pull_request.head.sha || github.sha }}
          name: coverage
          path: reports

      - name: Ruff artifact
        uses: dawidd6/action-download-artifact@b6e2e70617bc3265edd6dab6c906732b2f1ae151 # v21
        with:
          workflow: analysis.yml
          workflow_conclusion: success
          commit: ${{ github.event.pull_request.head.sha || github.sha }}
          name: ruff
          path: reports

      - name: Bandit artifact
        uses: dawidd6/action-download-artifact@b6e2e70617bc3265edd6dab6c906732b2f1ae151 # v21
        with:
          workflow: analysis.yml
          workflow_conclusion: success
          commit: ${{ github.event.pull_request.head.sha || github.sha }}
          name: bandit
          path: reports

      - name: SonarQube Cloud scan
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
